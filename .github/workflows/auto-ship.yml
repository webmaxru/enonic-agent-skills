name: Auto Ship Approved Skill Updates

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: auto-ship-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ship-approved-skill-update:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-ship.yml@562d47231f750e1ea857591d83bda052a89098cb
    with:
      hub_ref: 562d47231f750e1ea857591d83bda052a89098cb
      merge_method: squash
      release_workflow: release.yml
