name: Auto Ship Approved Skill Updates

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: auto-ship-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ship-approved-skill-update:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-ship.yml@cc1388ab79a680fec0607e9d27f0226c440ece45
    with:
      hub_ref: cc1388ab79a680fec0607e9d27f0226c440ece45
      merge_method: squash
      release_workflow: release.yml
