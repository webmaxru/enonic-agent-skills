name: Validate Skills

on:
  pull_request:
    paths:
      - skills/**
      - .github/workflows/**
      - .claude-plugin/plugin.json
      - .github/plugin/plugin.json
      - apm.yml
      - apm.lock.yaml
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths:
      - skills/**
      - .claude-plugin/plugin.json
      - .github/plugin/plugin.json
      - apm.yml
      - apm.lock.yaml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-validate.yml@406c8e08f20eb5b4642c714e8adf9f8e4d54acab
    with:
      hub_ref: 406c8e08f20eb5b4642c714e8adf9f8e4d54acab
