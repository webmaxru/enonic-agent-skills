name: Repository Health

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-repo-health.yml@webmaxru-automation-auto-release
    with:
      hub_ref: webmaxru-automation-auto-release
